<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My registrations | K Explore</title>
  <meta name="description" content="View and manage the event registrations saved on this device.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
</head>
<body data-page="mine">
<header id="site-header"></header>
<main id="main">
  <section class="page-head"><div class="container"><p class="eyebrow">Your account</p><h1>My registrations</h1><p class="hero-lead" id="reg-summary"></p></div></section>
  <section class="section tight">
    <div class="container narrow">
      <div class="demo-banner">Registrations are stored in this browser's LocalStorage. They will not appear on another device or if you clear site data.</div>
      <ul class="reg-list" id="reg-list"></ul>
      <div class="empty" id="reg-empty" hidden>
        <div class="empty-icon" aria-hidden="true">🎟️</div>
        <h2>No registrations yet</h2>
        <p>When you register for an event it will show up here.</p>
        <a class="btn btn-primary" href="events.html">Find an event</a>
      </div>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/my-registrations.js"></script>
</body>
</html>
